[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axis"
version = "0.1.0"
description = "AI Agent for Cloud, Kubernetes & Docker Operations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Axis Contributors" }
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
k8s = [
    "kubernetes>=29.0",
]
full = [
    "kubernetes>=29.0",
    "docker>=7.0",
]

[project.scripts]
axis = "axis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axis = ["py.typed"]
